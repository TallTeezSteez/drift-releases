# "Ship Drift": makes a Test release the Public one. The exact same files Wyatt tested; nothing is rebuilt.
name: Ship Drift (Public)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to ship (blank = the newest Test build)
        required: false

permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ]; then v=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName'); fi
          case "$v" in v*) ;; *) v="v$v";; esac
          gh release edit "$v" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest --title "Drift ${v#v}"
          echo "Shipped $v"
