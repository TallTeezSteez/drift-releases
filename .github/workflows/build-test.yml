# Builds a signed Drift for Windows whenever Drift's main branch has changed, and publishes it as a Test release.
# Runs here (public repo = free build minutes). Master copy: release/drift-releases/ in the Drift repo.
name: Build Drift (Test)

on:
  schedule:
    - cron: '17 * * * *' # every hour; does nothing if main hasn't changed
  workflow_dispatch:
    inputs:
      force:
        description: Build even if nothing changed
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  look:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.s.outputs.sha }}
      go: ${{ steps.s.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: s
        env:
          GH_TOKEN: ${{ secrets.DRIFT_REPO_TOKEN }}
        run: |
          sha=$(gh api repos/TallTeezSteez/drift/commits/main --jq .sha)
          last=$(cat built-sha 2>/dev/null || true)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$sha" != "$last" ] || [ "${{ inputs.force }}" = "true" ]; then echo "go=yes" >> "$GITHUB_OUTPUT"; else echo "go=no" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: look
    if: needs.look.outputs.go == 'yes'
    runs-on: windows-latest
    env:
      VERSION: 0.2.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: releases
      - uses: actions/checkout@v4
        with:
          repository: TallTeezSteez/drift
          ref: ${{ needs.look.outputs.sha }}
          token: ${{ secrets.DRIFT_REPO_TOKEN }}
          path: drift
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: drift/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: drift/src-tauri

      - name: Build and sign
        working-directory: drift
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DRIFT_PUBKEY: ${{ secrets.DRIFT_PUBKEY }}
        run: |
          npm ci
          node -e '
            const c = { version: process.env.VERSION, bundle: { createUpdaterArtifacts: true, targets: ["nsis"] },
                        plugins: { updater: { pubkey: process.env.DRIFT_PUBKEY.trim() } } };
            require("fs").writeFileSync("release.conf.json", JSON.stringify(c));'
          npx tauri build --config release.conf.json

      - name: Publish Test release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DRIFT_TOKEN: ${{ secrets.DRIFT_REPO_TOKEN }}
          SHA: ${{ needs.look.outputs.sha }}
        run: |
          dir=drift/src-tauri/target/release/bundle/nsis
          exe=$(ls "$dir"/*-setup.exe | head -1); name=$(basename "$exe")
          sig=$(cat "$exe.sig")
          notes=$(GH_TOKEN=$DRIFT_TOKEN gh api "repos/TallTeezSteez/drift/commits/$SHA" --jq '.commit.message' | head -1)
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${name// /%20}"
          node -e '
            const [v, notes, sig, url] = process.argv.slice(1);
            const j = { version: v, notes, pub_date: new Date().toISOString(),
                        platforms: { "windows-x86_64": { signature: sig, url } } };
            require("fs").writeFileSync("latest.json", JSON.stringify(j, null, 2));' "$VERSION" "$notes" "$sig" "$url"
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --prerelease --target main \
            --title "Drift $VERSION (Test)" --notes "$notes" "$exe" "$exe.sig" latest.json
          cp latest.json releases/test.json
          echo "$SHA" > releases/built-sha
          cd releases
          git config user.name "drift-builds"; git config user.email "drift-builds@users.noreply.github.com"
          git add test.json built-sha
          git commit -m "Test: Drift $VERSION"
          git push
